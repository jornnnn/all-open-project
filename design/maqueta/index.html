const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
let vtSeq = 0;
function withTransition(kind, update) {
  if (!document.startViewTransition || reduceMotion()) { update(); return null; }
  const root = document.documentElement;
  const seq = ++vtSeq;
  root.dataset.vt = kind;
  const vt = document.startViewTransition(update);

  const ua = navigator.userAgent || '';

  if (/Macintosh|Mac OS X/i.test(ua)) return 'mac';

const SORTS = {
  relevancia: () => 0,
  puntuacion: (a, b) => b.score - a.score,
  estrellas: (a, b) => b.stars - a.stars,
  auge: (a, b) => b.week - a.week,
  reciente: (a, b) => a.days - b.days,
  nombre: (a, b) => a.name.localeCompare(b.name),
};
const BASE_SORTS = ['puntuacion', 'estrellas', 'auge', 'reciente', 'nombre'];

const MULTI = ['tema', 'para', 'so', 'lic', 'inst', 'est'];
const MIN_STARS = [0, 5000, 20000, 100000];
const GROUPS = [
  { k: 'tema', label: 'g_tema', opts: () => TASKS.map(x => [x.id, x[state.lang]]), test: (p, v) => p.tasks.includes(v) },
  { k: 'para', label: 'g_para', opts: () => [['usar', t('o_usar')], ['programar', t('o_programar')]], test: (p, v) => p.aud === v },
  { k: 'so', label: 'g_so', opts: () => Object.entries(OS_CAP[state.lang]), test: (p, v) => p.os.includes(v) },

  { k: 'inst', label: 'g_inst', opts: () => [['easy', t('o_easy')], ['steps', t('o_steps')], ['dev', t('o_dev')]], test: (p, v) => p.install === v },

];

function parseHash() {
  const raw = location.hash.replace(/^#\/?/, '');
  const qi = raw.indexOf('?');
  let path = qi >= 0 ? raw.slice(0, qi) : raw;
  try { path = decodeURIComponent(path); } catch {}
  return { parts: path.split('/').filter(Boolean), query: new URLSearchParams(qi >= 0 ? raw.slice(qi + 1) : '') };
}
const emptyFilters = orden => ({ tema: [], para: [], so: [], lic: [], inst: [], est: [], es: false, min: 0, orden });
function readFilters(query, defaultSort = 'puntuacion') {
  const asked = query.get('orden');
  const f = emptyFilters(asked && SORTS[asked] ? asked : defaultSort);
  MULTI.forEach(k => { f[k] = (query.get(k) || '').split(',').filter(Boolean); });
  f.es = query.get('es') === '1';
  f.min = Number(query.get('min')) || 0;
  return f;
}
function writeFilters(f, defaultSort) {
  const out = [];
  MULTI.forEach(k => { if (f[k].length) out.push(`${k}=${f[k].map(encodeURIComponent).join(',')}`); });
  if (f.es) out.push('es=1');
  if (f.min) out.push(`min=${f.min}`);
  if (f.orden !== defaultSort) out.push(`orden=${f.orden}`);
  return out.join('&');
}
function matches(p, f, skip = '') {
  for (const g of GROUPS) {
    if (g.k === skip || !f[g.k].length) continue;
    if (!f[g.k].some(v => g.test(p, v))) return false;
  }
  if (skip !== 'es' && f.es && !p.es) return false;
  if (skip !== 'min' && f.min && p.stars < f.min) return false;
  return true;
}
const activeCount = f => MULTI.reduce((n, k) => n + f[k].length, 0) + (f.es ? 1 : 0) + (f.min ? 1 : 0);
const currentFilters = () => readFilters(parseHash().query, state.listCtx ? state.listCtx.defaultSort : 'puntuacion');

function setFilters(f) {
  const ctx = state.listCtx;
  const { parts } = parseHash();
  const qs = writeFilters(f, ctx ? ctx.defaultSort : 'puntuacion');
  const apply = () => {
    history.replaceState(null, '', `#/${parts.map(encodeURIComponent).join('/')}${qs ? `?${qs}` : ''}`);
    render();
    if (state.sheetOpen) openFilterSheet();
  };
  // Con el panel de filtros del móvil abierto, sin transición: el panel se refresca en su sitio
  if (state.sheetOpen) apply(); else withTransition('filter', apply);
}

  const os = OS[state.os][state.lang];
  if (p.os.includes(state.os)) return chip('ok', 'circle-check', t('works_on')(os));
  if (p.os.includes('server')) return chip('done', 'server', t('on_server'));
  return chip('done', 'circle-minus', t('not_on')(os));
}

const arrowLink = (href, label) =>
  `<a href="${href}" class="group inline-flex shrink-0 items-center gap-1 text-sm font-medium text-brand">${esc(label)}<i data-lucide="arrow-right" class="size-4 transition-transform duration-200 group-hover:translate-x-0.5" aria-hidden="true"></i></a>`;

const eyebrow = text => `<p class="font-mono text-xs tracking-widest text-brand uppercase">${esc(text)}</p>`;

const sectionHead = (eb, title, right = '') => `<div class="mb-8 flex items-end justify-between gap-4">
  <div>${eyebrow(eb)}<h2 class="mt-2 text-3xl font-semibold tracking-tight text-balance md:text-4xl">${esc(title)}</h2></div>
  ${right}
</div>`;

// Capturas ilustradas (sin imágenes externas)
function shot(p, v = 0) {
  const r = rng(`${p.id}:${v}`);
  const h = p.hue + v * 18;
  const box = style => `<div style="position:absolute;${style}"></div>`;
  let bg = c(0.97, 0.004, 265);
  let inner = '';
  switch (p.shot) {
    case 'video': {
      bg = '#15171d';
      inner += box(`left:16%;right:16%;top:7%;height:46%;border-radius:8px;background:linear-gradient(135deg,${c(0.72, 0.13, h)},${c(0.45, 0.16, h + 50)})`);
      inner += box(`left:50%;top:30%;width:0;height:0;transform:translate(-40%,-50%);border-style:solid;border-width:9px 0 9px 15px;border-color:transparent transparent transparent rgba(255,255,255,.9)`);
      for (let row = 0; row < 3; row++) {
        let x = 3;
        while (x < 94) {
          const w = 7 + r() * 20;
          if (x + w > 97) break;
          inner += box(`left:${x}%;width:${w}%;top:${61 + row * 12}%;height:9%;border-radius:4px;background:${c(0.6, 0.12, h + row * 55)}`);
          x += w + 1.2;
        }
      }
      inner += box(`left:${32 + v * 17}%;top:57%;bottom:3%;width:2px;background:#fff`);
      break;
    }
    case 'photo': {
      inner += box(`left:0;top:0;bottom:0;width:8%;background:${c(0.92, 0.006, 265)}`);
      for (let i = 0; i < 5; i++) inner += box(`left:2%;top:${8 + i * 13}%;width:4%;height:7%;border-radius:3px;background:${c(0.8, 0.012, 265)}`);
      inner += `<div style="position:absolute;left:11%;right:23%;top:7%;bottom:7%;border-radius:6px;overflow:hidden;background:linear-gradient(${c(0.82, 0.08, h + 190)},${c(0.94, 0.04, h + 210)})">
        ${box(`right:16%;top:12%;width:13%;aspect-ratio:1;border-radius:50%;background:${c(0.9, 0.13, 85)}`)}
        ${box(`left:0;right:0;bottom:0;top:38%;background:${c(0.55, 0.09, h + 120)};clip-path:polygon(0 100%,0 62%,22% 12%,42% 55%,63% 0,100% 66%,100% 100%)`)}
        ${box(`left:0;right:0;bottom:0;top:64%;background:${c(0.4, 0.08, h + 135)};clip-path:polygon(0 100%,0 45%,28% 0,58% 52%,84% 18%,100% 42%,100% 100%)`)}
      </div>`;
      inner += box(`right:0;top:0;bottom:0;width:20%;background:${c(0.955, 0.005, 265)}`);
      for (let i = 0; i < 4; i++) {
        inner += box(`right:3%;width:14%;top:${14 + i * 19}%;height:2px;background:${c(0.82, 0.01, 265)}`);
        inner += box(`right:${4 + r() * 10}%;top:calc(${14 + i * 19}% - 4px);width:10px;height:10px;border-radius:50%;background:${c(0.52, 0.2, 265)}`);
      }
      break;
    }
    case 'paint': {
      bg = '#2a2d35';
      inner += box(`left:10%;right:14%;top:8%;bottom:8%;border-radius:6px;background:#fff`);
      for (let i = 0; i < 7; i++) inner += box(`left:${16 + r() * 36}%;top:${16 + r() * 58}%;width:${14 + r() * 20}%;height:${3 + r() * 5}%;border-radius:999px;transform:rotate(${-40 + r() * 80}deg);background:${c(0.64, 0.17, h + i * 47)};opacity:.9`);
      inner += box(`right:2.5%;top:10%;width:8%;aspect-ratio:1;border-radius:50%;background:conic-gradient(#f43,#fc3,#5d5,#3cf,#55f,#e4e,#f43)`);
      for (let i = 0; i < 4; i++) inner += box(`right:3.5%;top:${30 + i * 12}%;width:6%;height:7%;border-radius:4px;background:${c(0.4, 0.02, 265)}`);
      break;
    }
    case 'chat': {
      bg = '#fff';
      inner += box(`left:0;top:0;bottom:0;width:22%;background:${c(0.955, 0.012, h)}`);
      for (let i = 0; i < 6; i++) inner += box(`left:3%;top:${9 + i * 10}%;width:${10 + r() * 7}%;height:4%;border-radius:3px;background:${c(0.85, 0.025, h)}`);
      inner += box(`right:5%;top:9%;width:${30 + v * 6}%;height:11%;border-radius:12px 12px 4px 12px;background:${c(0.55, 0.17, h)}`);
      inner += box(`left:27%;top:25%;width:58%;height:${30 + v * 4}%;border-radius:12px 12px 12px 4px;background:${c(0.96, 0.005, 265)}`);
      for (let i = 0; i < 4; i++) inner += box(`left:30%;top:${30 + i * 7}%;width:${48 - r() * 18}%;height:3.6%;border-radius:2px;background:${c(0.8, 0.01, 265)}`);
      inner += box(`left:27%;right:5%;bottom:7%;height:11%;border-radius:999px;background:#fff;box-shadow:0 0 0 1px ${c(0.88, 0.01, 265)}`);
      inner += box(`right:6.5%;bottom:9.2%;height:6.5%;aspect-ratio:1;border-radius:50%;background:${c(0.55, 0.17, h)}`);
      break;
    }
    case 'doc': {
      bg = c(0.93, 0.008, 265);
      inner += box(`left:0;right:0;top:0;height:12%;background:${c(0.97, 0.006, 265)}`);
      for (let i = 0; i < 8; i++) inner += box(`left:${3 + i * 5.5}%;top:3.5%;width:3.6%;height:5%;border-radius:3px;background:${c(0.8, 0.03, h)}`);
      inner += box(`left:20%;right:20%;top:17%;bottom:0;background:#fff;box-shadow:0 0 0 1px ${c(0.88, 0.006, 265)}`);
      inner += box(`left:25%;top:23%;width:28%;height:6%;border-radius:3px;background:${c(0.5, 0.15, h)}`);
      for (let i = 0; i < 6; i++) inner += box(`left:25%;top:${35 + i * 9}%;width:${50 - r() * 14}%;height:3.4%;border-radius:2px;background:${c(0.86, 0.006, 265)}`);
      if (v === 1) for (let i = 0; i < 5; i++) inner += box(`left:${56 + i * 4}%;bottom:12%;width:2.6%;height:${8 + r() * 22}%;background:${c(0.6, 0.14, h + 40)};border-radius:2px 2px 0 0`);
      break;
    }
    case 'audio': {
      bg = '#121318';
      for (let tr = 0; tr < 2; tr++) {
        inner += box(`left:3%;right:3%;top:${10 + tr * 44}%;height:36%;border-radius:8px;background:${c(0.25, 0.03, h + tr * 40)}`);
        for (let i = 0; i < 56; i++) {
          const hh = 6 + r() * 26;
          inner += box(`left:${5 + i * 1.62}%;width:0.9%;top:${28 + tr * 44 - hh / 2}%;height:${hh}%;border-radius:2px;background:${c(0.74, 0.15, h + tr * 40)}`);
        }
      }
      inner += box(`left:${30 + v * 20}%;top:6%;bottom:6%;width:2px;background:#fff`);
      break;
    }
    case 'vault': {
      inner += box(`left:5%;right:5%;top:7%;height:11%;border-radius:999px;background:#fff;box-shadow:0 0 0 1px ${c(0.9, 0.006, 265)}`);
      for (let i = 0; i < 4; i++) {
        const y = 24 + i * 18.5;
        inner += box(`left:5%;right:5%;top:${y}%;height:14.5%;border-radius:10px;background:#fff;box-shadow:0 0 0 1px ${c(0.91, 0.006, 265)}`);
        inner += box(`left:8%;top:${y + 3}%;height:8.5%;aspect-ratio:1;border-radius:50%;background:${c(0.66, 0.14, h + i * 70)}`);
        inner += box(`left:17%;top:${y + 3.3}%;width:${26 - i * 3}%;height:3.4%;border-radius:2px;background:${c(0.4, 0.02, 265)}`);
        inner += box(`left:17%;top:${y + 8.6}%;width:18%;height:2.8%;border-radius:2px;background:${c(0.85, 0.006, 265)}`);
        inner += box(`right:8%;top:${y + 4.2}%;width:4.2%;height:6%;border-radius:3px;background:${c(0.55, 0.13, 150)}`);
      }
      break;
    }
    case 'gallery': {
      bg = c(0.98, 0.003, 265);
      inner += box(`left:0;right:0;top:0;height:11%;background:#fff;box-shadow:0 1px 0 ${c(0.9, 0.006, 265)}`);
      inner += box(`left:3%;top:3.5%;width:20%;height:4%;border-radius:3px;background:${c(0.55, 0.15, h)}`);
      for (let i = 0; i < 15; i++) {
        const col = i % 5, row = Math.floor(i / 5);
        inner += box(`left:${3 + col * 19}%;top:${16 + row * 28}%;width:18%;height:25%;border-radius:6px;background:linear-gradient(135deg,${c(0.78, 0.09, h + r() * 300)},${c(0.52, 0.12, h + r() * 300)})`);
      }
      break;
    }
    case 'media': {
      bg = '#101218';
      inner += box(`left:4%;top:7%;width:26%;height:6%;border-radius:3px;background:${c(0.8, 0.03, h)}`);
      inner += box(`left:4%;top:16%;width:16%;height:4%;border-radius:3px;background:${c(0.45, 0.02, h)}`);
      for (let i = 0; i < 6; i++) inner += box(`left:${4 + i * 15.6}%;top:27%;width:14%;height:62%;border-radius:6px;background:linear-gradient(180deg,${c(0.62, 0.13, h + r() * 220)},${c(0.3, 0.07, h + r() * 220)})`);
      break;
    }
    case 'code': {
      bg = '#14161c';
      inner += box(`left:0;top:0;bottom:0;width:15%;background:#1b1e26`);
      for (let i = 0; i < 5; i++) inner += box(`left:2.5%;top:${8 + i * 9}%;width:${8 + r() * 4}%;height:3.5%;border-radius:2px;background:#2f3440`);
      for (let i = 0; i < 9; i++) {
        const y = 7 + i * 9.6;
        inner += box(`left:17%;top:${y}%;width:2%;height:3.8%;border-radius:2px;background:#353a46`);
        let x = 22 + (i % 3) * 3;
        const n = 1 + Math.floor(r() * 3);
        for (let k = 0; k < n; k++) {
          const w = 6 + r() * 15;
          if (x + w > 96) break;
          inner += box(`left:${x}%;top:${y}%;width:${w}%;height:3.8%;border-radius:2px;background:${c(0.74, 0.13, [h, 30, 150, 200][Math.floor(r() * 4)])}`);
          x += w + 1.5;
        }
      }
      break;
    }
    case 'term': {
      bg = '#0f1115';
      inner += box(`left:0;right:0;top:0;height:10%;background:#1d2027`);
      ['#ff5f57', '#febc2e', '#28c840'].forEach((col, i) => { inner += box(`left:${3 + i * 3}%;top:3%;height:4%;aspect-ratio:1;border-radius:50%;background:${col}`); });
      const lines = ((p.term && p.term[state.lang]) || []).map(l =>
        l.startsWith('$') ? `<span style="color:${c(0.8, 0.15, 150)}">${esc(l)}</span>`
        : l.startsWith('✔') ? `<span style="color:${c(0.85, 0.1, 200)}">${esc(l)}</span>`
        : esc(l));
      inner += `<div style="position:absolute;left:4%;right:4%;top:16%;font:500 clamp(9px,2.6cqw,13px)/1.7 'Geist Mono',ui-monospace,monospace;color:#d7dbe4;white-space:pre;overflow:hidden">${lines.join('\n')}</div>`;
      break;
    }
    case 'nodes': {
      inner += `<div style="position:absolute;inset:0;background-image:radial-gradient(${c(0.84, 0.01, 265)} 1px,transparent 1px);background-size:14px 14px"></div>`;
      inner += `<svg viewBox="0 0 100 62.5" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%" aria-hidden="true"><path d="M22 21 C 33 21, 33 34, 44 34 M62 34 C 71 34, 71 19, 80 19 M62 34 C 71 34, 71 45, 80 45" stroke="${c(0.6, 0.12, h)}" stroke-width="2" fill="none" vector-effect="non-scaling-stroke"/></svg>`;
      [[6, 22, 16, 22], [44, 41.6, 18, 26], [80, 19.2, 16, 22], [80, 60.8, 16, 22]].forEach(([x, y, w, hh], i) => {
        inner += `<div style="position:absolute;left:${x}%;top:${y}%;width:${w}%;height:${hh}%;border-radius:8px;background:#fff;box-shadow:0 0 0 1px ${c(0.88, 0.01, 265)},0 2px 6px rgb(0 0 0/.06);overflow:hidden"><div style="height:28%;background:${c(0.62, 0.15, h + i * 45)}"></div>${box(`left:10%;top:44%;width:70%;height:12%;border-radius:2px;background:${c(0.88, 0.006, 265)}`)}${box(`left:10%;top:66%;width:50%;height:12%;border-radius:2px;background:${c(0.88, 0.006, 265)}`)}</div>`;
      });
      break;
    }
    case 'game': {
      bg = c(0.85, 0.06, 220);
      inner += box(`inset:0;background:linear-gradient(${c(0.78, 0.1, 230)},${c(0.93, 0.05, 200)})`);
      inner += box(`right:12%;top:12%;width:9%;aspect-ratio:1;border-radius:50%;background:${c(0.93, 0.14, 90)}`);
      inner += box(`left:0;right:0;bottom:0;height:46%;background:${c(0.64, 0.15, 140)}`);
      inner += box(`left:20%;right:20%;bottom:0;height:46%;background:${c(0.42, 0.02, 265)};clip-path:polygon(44% 0,56% 0,100% 100%,0 100%)`);
      for (let i = 0; i < 5; i++) inner += box(`left:49.4%;bottom:${4 + i * 8.5}%;width:1.2%;height:4%;background:#fff;opacity:.8`);
      [[8, 47], [18, 50], [76, 46], [87, 51]].forEach(([x, b]) => {
        inner += box(`left:${x + 3}%;bottom:${b - 4}%;width:1%;height:5%;background:${c(0.38, 0.06, 60)}`);
        inner += box(`left:${x}%;bottom:${b}%;width:7%;aspect-ratio:1;border-radius:50%;background:${c(0.48, 0.13, 145)}`);
      });
      inner += box(`left:${42 + v * 3}%;bottom:7%;width:14%;height:13%;border-radius:8px 8px 4px 4px;background:${c(0.6, 0.2, 27)}`);
      inner += box(`left:${44 + v * 3}%;bottom:4%;width:3.5%;height:6%;border-radius:2px;background:#222`);
      inner += box(`left:${51.5 + v * 3}%;bottom:4%;width:3.5%;height:6%;border-radius:2px;background:#222`);
      break;
    }
  }
  return `<div class="relative aspect-[16/10] w-full overflow-hidden rounded-xl ring-1 ring-white/10" style="background:${bg};container-type:inline-size" role="img" aria-label="${esc(t('shot_of')(p.name))}">${inner}</div>`;
}

// vt: da a la tarjeta un nombre de transición para que se deslice a su nuevo sitio al filtrar u ordenar
function card(p, { rank = 0, week = false, vt = false } = {}) {
  const L = state.lang;
  const extra = [];
  if (p.fakes) extra.push(chip('bad', 'triangle-alert', t('chip_fakes')));
  if (p.lic === 'limited') extra.push(chip('warn', 'lock-keyhole', t('lic_limited_short')));
  const metric = week
    ? chip('ok', 'trending-up', `+${fmt(p.week)} ★ ${t('per_week')}`)
    : `<span class="inline-flex items-center gap-1 font-mono text-xs text-muted"><i data-lucide="star" class="size-3.5" aria-hidden="true"></i>${fmtShort(p.stars)}</span>`;
  return `<a href="#/${p.id}" ${vt ? `style="view-transition-name:v-${p.id.replace(/[^a-zA-Z0-9]/g, '-')};view-transition-class:pcard"` : ''} class="spot group block h-full rounded-2xl bg-card p-2.5 ring-1 ring-line transition duration-300 ease-out-expo hover:ring-brand/40 motion-safe:hover:-translate-y-0.5 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand">
    ${shot(p, 0)}
    <div class="mt-3 flex items-start gap-3 px-1.5">
      ${appIcon(p)}
      <div class="min-w-0 flex-1">
        <div class="flex items-baseline gap-2"><h3 class="truncate font-semibold tracking-tight">${esc(p.name)}</h3>${rank ? `<span class="font-mono text-xs text-muted">#${rank}</span>` : ''}</div>
        <p class="line-clamp-2 text-sm leading-snug text-muted">${esc(p.tag[L])}</p>
      </div>
    </div>
    <div class="mt-3 flex flex-wrap items-center gap-1.5 px-1.5 pb-1.5">${metric}${osChip(p)}${extra.join('')}</div>
  </a>`;
}

function activeChips(f) {
  const chips = [];
  GROUPS.forEach(g => {
    const opts = g.opts();
    f[g.k].forEach(v => { const o = opts.find(([x]) => x === v); if (o) chips.push([`${g.k}:${v}`, o[1]]); });
  });
  if (f.es) chips.push(['es:1', t('o_es')]);
  if (f.min) chips.push([`min:${f.min}`, t('o_min')(f.min)]);
  if (!chips.length) return '';

  return `<li><button type="button" ${attr} ${disabled ? 'disabled' : ''} aria-pressed="${on}" class="flex w-full items-center gap-2.5 rounded-lg px-2 py-1.5 text-left text-sm transition ${disabled ? 'cursor-not-allowed opacity-35' : 'hover:bg-line/60'} ${on ? 'font-medium text-ink' : 'text-ink/90'}">${mark}<span class="flex-1">${esc(label)}</span>${n === null ? '' : `<span class="font-mono text-xs text-muted">${n}</span>`}</button></li>`;

function filterGroups(items, f, showTema, sorts = null) {
  const sec = (title, body) => `<section class="border-b border-line py-4 first:pt-1 last:border-0"><h3 class="mb-2 px-2 font-mono text-xs tracking-widest text-muted uppercase">${title}</h3><ul class="space-y-0.5">${body}</ul></section>`;

  if (sorts) html += sec(t('sort_label'), sorts.map(k => optRow(`data-fsort="${k}"`, t(`sort_${k}`), null, f.orden === k, 'radio')).join(''));
  GROUPS.filter(g => showTema || g.k !== 'tema').forEach(g => {
    html += sec(t(g.label), g.opts().map(([v, label]) => optRow(`data-fopt="${g.k}:${v}"`, label, items.filter(p => matches(p, f, g.k) && g.test(p, v)).length, f[g.k].includes(v), 'check')).join(''));

}

// Buscador: tareas, «alternativa a X» y proyectos

// Mientras se escribe (prefix) vale que la palabra esté a medias; en resultados, solo palabras enteras.
function taskHits(nq, prefix = true) {
  const words = nq.split(/\s+/).filter(Boolean);
  return TASKS.filter(task => {
    const kws = norm(`${task.es} ${task.en} ${task.kw}`).split(/\s+/);
    return words.some(w => kws.some(k => k === w || (prefix && w.length >= 3 && k.startsWith(w))));
  });
}
function synHits(nq) {
  const seen = new Set();
  return Object.entries(SYN)
    .filter(([k]) => nq.includes(k) || (nq.length >= 3 && k.startsWith(nq)))
    .map(([k, v]) => ({ key: k, ...v }))
    .filter(s => { const key = s.ids.join(); if (seen.has(key)) return false; seen.add(key); return true; });
}
// Relevancia: palabra entera (o su plural) = 2, palabra que empieza por la misma raíz = 1,
// nombre que empieza igual = 3, y +3 si es alternativa directa a lo buscado («photoshop» → GIMP).
// Si hay coincidencias fuertes, se descartan las flojas. Busca primero en el idioma activo.
function searchProjects(nq, langs = [state.lang]) {
  const words = nq.split(/\s+/).filter(w => w.length >= 3);
  if (!words.length) return [];
  const boosted = new Set(synHits(nq).filter(s => nq.includes(s.key)).flatMap(s => s.ids));
  const scored = P.map(p => {
    const hayWords = norm(`${p.name} ${langs.map(l => `${p.tag[l]} ${p.about[l]}`).join(' ')}`).split(/[^a-z0-9]+/);
    let score = 0;
    for (const w of words) {
      if (hayWords.some(x => x === w || x === `${w}s` || x === `${w}es`)) score += 2;
      else if (hayWords.some(x => x.startsWith(w.slice(0, 4)))) score += 1;
    }
    if (norm(p.name).startsWith(nq)) score += 3;
    if (boosted.has(p.id)) score += 3;
    return [p, score];
  }).filter(([, score]) => score > 0);
  if (!scored.length && langs.length === 1) return searchProjects(nq, ['es', 'en']);
  const best = Math.max(0, ...scored.map(([, score]) => score));
  return scored
    .filter(([, score]) => best < 3 || score >= 2)
    .sort((a, b) => b[1] - a[1] || b[0].score - a[0].score)
    .map(([p]) => p);
}

function results(q) {
  const nq = norm(q);
  const syn = synHits(nq).find(s => nq.includes(s.key));
  if (syn) return altPage(syn.key);
  const seen = new Set();
  const items = [];
  const add = p => { if (!seen.has(p.id)) { seen.add(p.id); items.push(p); } };
  searchProjects(nq).forEach(add);
  taskHits(nq, false).forEach(task => inTask(task.id).forEach(add));
  return listPage({ title: t('results_for')(q), icon: 'search', items, showTema: true, defaultSort: 'relevancia', eb: t('eb_search') });
}

function spark(arr, mini = false) {
  const w = 300, h = 60, max = Math.max(...arr), min = Math.min(...arr);
  const pts = arr.map((v, i) => [i * (w / (arr.length - 1)), h - 6 - ((v - min) / (max - min || 1)) * (h - 12)]);
  const d = 'M' + pts.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join(' L');
  const [lx, ly] = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="${mini ? 'h-12' : 'mt-2 h-20'} w-full overflow-visible" role="img" aria-label="${esc(t('weeks12'))}">

    <path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#sg)"/>
    <path d="${d}" fill="none" style="stroke:var(--color-brand);filter:drop-shadow(0 0 6px color-mix(in oklch, var(--color-brand) 70%, transparent))" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" class="spark-draw"/>

  </svg>`;
}

// Cifras de la portada que cuentan hacia arriba (solo la primera vez)
function countUp() {
  const els = document.querySelectorAll('[data-count]');
  if (!els.length || state.counted) return;
  state.counted = true;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const start = performance.now(), dur = 1400;
  const ease = x => 1 - Math.pow(1 - x, 4);
  const step = now => {
    const k = Math.min(1, (now - start) / dur);
    els.forEach(el => { el.textContent = fmt(Math.round(Number(el.dataset.count) * ease(k))); });
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function suggestions(q) {
  const nq = norm(q);
  if (nq.length < 2) return [];
  const out = [];
  synHits(nq).filter(s => !s.lang || s.lang === state.lang).slice(0, 2).forEach(s => out.push({ kind: 'alt', s }));
  taskHits(nq).slice(0, 2).forEach(task => out.push({ kind: 'task', task }));
  searchProjects(nq).slice(0, 4).forEach(p => out.push({ kind: 'p', p }));
  return out.slice(0, 7);
}
const suggestItem = (href, iconHtml, title, sub) =>
  `<li><a href="${href}" class="flex items-center gap-3 px-4 py-2.5 transition hover:bg-line/60 focus-visible:bg-line/60 focus-visible:outline-none">${iconHtml}<span class="min-w-0"><span class="block truncate font-medium">${esc(title)}</span><span class="block truncate text-sm text-muted">${esc(sub)}</span></span></a></li>`;

function renderSuggest(id, q) {
  const box = document.querySelector(`[data-suggest="${id}"]`);
  if (!box) return;
  const items = suggestions(q);
  if (!items.length) { box.classList.add('hidden'); box.innerHTML = ''; return; }
  const L = state.lang;
  box.innerHTML = `<ul class="py-2">${items.map(it => {
    if (it.kind === 'alt') return suggestItem(`#/alternativas-a/${encodeURIComponent(it.s.key)}`, `<span class="grid size-9 shrink-0 place-items-center rounded-xl bg-brand-soft text-brand"><i data-lucide="repeat" class="size-4" aria-hidden="true"></i></span>`, t('alts_to')(it.s.label), t('programs')(it.s.ids.length));
    if (it.kind === 'task') return suggestItem(`#/tarea/${it.task.id}`, taskIcon(it.task), it.task[L], t('programs')(inTask(it.task.id).length));
    return suggestItem(`#/${it.p.id}`, appIcon(it.p, 'size-9 rounded-xl', 'size-4'), it.p.name, it.p.tag[L]);
  }).join('')}</ul>`;
  box.classList.remove('hidden');
  icons();
}
function hideSuggest() {
  document.querySelectorAll('[data-suggest]').forEach(b => b.classList.add('hidden'));
}
function go(q) {
  const nq = norm(q);
  const task = TASKS.find(x => norm(x.es) === nq || norm(x.en) === nq);
  closeModal();
  const target = task ? `#/tarea/${task.id}` : `#/buscar/${encodeURIComponent(q)}`;
  if (location.hash === target) render(); else location.hash = target;
}

function view() {
  const [a, b] = parseHash().parts;
  if (!a) return home();
  switch (a) {
    case 'tarea': { const task = TASKS.find(x => x.id === b); return task ? taskPage(task) : notFound(); }
    case 'buscar': return results(parseHash().parts.slice(1).join('/'));
    case 'top': return topPage();
    case 'explorar': return explorePage();
    case 'alternativas': return altsIndex();
    case 'alternativas-a': return altPage(b);
    case 'alertas': return alertsPage();
  }
  const p = BY_LC[`${a}/${b || ''}`.toLowerCase()];
  return p ? project(p) : notFound();
}
function render() {
  state.listCtx = null;
  document.documentElement.lang = state.lang;
  document.documentElement.dataset.theme = state.theme;
  const main = view();
  $('#app').innerHTML = header() + alertBar() + main + footer() + mockPanel();
  icons();
  countUp();
  state.entering = false;
}

document.addEventListener('pointermove', e => {
  const el = e.target.closest && e.target.closest('.spot');
  if (!el) return;
  const r = el.getBoundingClientRect();
  el.style.setProperty('--x', `${e.clientX - r.left}px`);

}, { passive: true });

document.addEventListener('click', e => {

  const el = e.target.closest('[data-action],[data-lang],[data-fopt],[data-fone],[data-fquick],[data-fremove],[data-fsort]');
  if (!el) return;
  const d = el.dataset;
  if (d.lang) {
    if (state.lang !== d.lang) {
      const reopen = state.drawerOpen ? openDrawer : state.sheetOpen ? openFilterSheet : null;
      withTransition('lang', () => {
        state.lang = d.lang;
        store.set('aop-lang', state.lang);
        render();
        if (reopen) reopen();
      });
    }
    return;
  }
  if (d.fopt) {
    const [k, v] = d.fopt.split(':');
    const f = currentFilters();
    if (k === 'es') f.es = !f.es;
    else f[k] = f[k].includes(v) ? f[k].filter(x => x !== v) : [...f[k], v];
    setFilters(f);
    return;
  }
  if (d.fone) {
    const [k, v] = d.fone.split(':');
    const f = currentFilters();
    f[k] = Number(v);
    setFilters(f);
    return;
  }
  if (d.fsort) {
    const f = currentFilters();
    f.orden = d.fsort;
    setFilters(f);
    return;
  }
  if (d.fquick) {
    const f = currentFilters();
    const only = (arr, v) => (arr.length === 1 && arr[0] === v ? [] : [v]);
    if (d.fquick === 'myos') f.so = only(f.so, state.os);
    if (d.fquick === 'open') f.lic = only(f.lic, 'open');
    if (d.fquick === 'es') f.es = !f.es;
    if (d.fquick === 'easy') f.inst = only(f.inst, 'easy');
    setFilters(f);
    return;
  }
  if (d.fremove) {
    const [k, v] = d.fremove.split(':');
    const f = currentFilters();
    if (k === 'es') f.es = false;
    else if (k === 'min') f.min = 0;
    else f[k] = f[k].filter(x => x !== v);
    setFilters(f);
    return;
  }
  switch (d.action) {
    case 'mega': {
      const panel = $('#mega');
      const open = panel.classList.toggle('hidden') === false;
      el.setAttribute('aria-expanded', String(open));
      break;
    }
    case 'menu': openDrawer(); break;
    case 'theme': {
      // El tema nuevo se revela en un círculo que crece desde el botón pulsado
      const next = state.theme === 'dark' ? 'light' : 'dark';
      const box = el.getBoundingClientRect();
      const x = box.left + box.width / 2, y = box.top + box.height / 2;
      // Los colores son variables CSS: basta con cambiar el tema y el icono, sin redibujar la página
      const vt = withTransition('theme', () => { setTheme(next); syncThemeButtons(); });
      if (vt) vt.ready.then(() => {
        const r = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
        document.documentElement.animate(
          { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${r}px at ${x}px ${y}px)`] },
          { duration: 600, easing: 'cubic-bezier(.16, 1, .3, 1)', pseudoElement: '::view-transition-new(root)' },
        );
      }).catch(() => {});
      break;
    }
    case 'open-filters': openFilterSheet(); break;
    case 'close-alert': state.alert = false; session.set('aop-alert', 'off'); render(); break;
    case 'search': searchModal(); break;
    case 'toast': toast(d.msg); break;
    case 'agents': agentsModal(); break;
    case 'agent-view': agentView(BY_ID[d.id]); break;
    case 'close-modal': closeModal(); break;
    case 'modal-bg': if (e.target === el) closeModal(); break;
    case 'cta': ctaClick(BY_ID[d.id]); break;
    case 'gh': toast(t('toast_github')(d.id)); break;
    case 'set-os': setOS(d.os); break;
    case 'copy': copyText(d.text); break;
    case 'clear-filters': setFilters(emptyFilters(currentFilters().orden)); break;
  }
});

document.addEventListener('change', e => {
  if (e.target.matches('select[data-action="os"]')) setOS(e.target.value);
  if (e.target.matches('select[data-sort]')) {
    const f = currentFilters();
    f.orden = e.target.value;
    setFilters(f);
  }
});

document.addEventListener('input', e => {
  const inp = e.target.closest('input[data-search]');
  if (inp) renderSuggest(inp.dataset.search, inp.value);
});

document.addEventListener('submit', e => {
  const form = e.target;
  if (form.matches('[data-action="search-submit"]')) {
    e.preventDefault();
    const q = form.querySelector('input').value.trim();
    if (q) go(q);
  } else if (form.matches('[data-action="subscribe"]')) {
    e.preventDefault();
    form.reset();
    toast(t('subscribed'));
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { hideSuggest(); $('#mega')?.classList.add('hidden'); closeModal(); return; }
  const typing = e.target.closest('input, textarea, select');
  if (!typing && (e.key === '/' || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'))) {
    e.preventDefault();
    searchModal();
    return;
  }
  const form = e.target.closest('[role="search"]');
  if (form && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    const links = [...form.querySelectorAll('[data-suggest] a')];
    if (!links.length) return;
    e.preventDefault();
    const i = links.indexOf(document.activeElement);
    links[e.key === 'ArrowDown' ? (i + 1) % links.length : (i <= 0 ? links.length - 1 : i - 1)].focus();
  }
});

render();
})();
</script>
</body>
</html>
