name: Robot diario

# Cada noche: lee de GitHub todo el catálogo, lo guarda en D1 a través del Worker y publica los
# datos abiertos (data/export/) con un commit.

# Lo lanza el cron del Worker de Cloudflare a las 03:23 UTC (apps/worker/src/disparo.ts), una vez
# al día: las tareas programadas de GitHub no son fiables. También se puede lanzar a mano.
on:
  workflow_dispatch:

permissions:
  contents: write

# El mismo grupo que el radar horario: nunca van a la vez, para no sumar sus peticiones a GitHub.
concurrency:
  group: robot-github
  cancel-in-progress: false
  # Hasta 100 en espera, en orden. Sin esto, GitHub solo deja una esperando y cancela la anterior.
  queue: max

jobs:
  robot:
    name: Foto diaria del catálogo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Instala la versión de pnpm del campo «packageManager» de package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Solo el robot y lo que necesita (sin wrangler ni la web).
      - run: pnpm install --frozen-lockfile --filter "@aop/jobs..."
      - name: Robot diario
        run: pnpm diario
        env:
          # Token personal de solo lectura (opcional): GitHub frena mucho antes el automático de
          # Actions. Si falta o caduca, el robot usa el automático, más despacio, y lo avisa en /estado.
          ROBOT_TOKEN: ${{ secrets.ROBOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
      - name: Commit de los datos abiertos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/export
          if git diff --cached --quiet; then
            echo 'Los datos abiertos no han cambiado.'
            exit 0
          fi
          git commit -m "Datos abiertos del $(date -u +%F)"
          # Por si alguien ha subido algo mientras corría el robot (solo él toca data/export).
          git pull --rebase origin main
          git push origin HEAD:main
