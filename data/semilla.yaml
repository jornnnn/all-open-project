# Cómo se genera la lista semilla: jobs/semilla.ts → data/semilla.generada.json.
#
# 1. Para cada subtema se buscan en GitHub sus topics (taxonomia.yaml) y las consultas extra de
#    «busquedas», ordenadas por estrellas, sin forks ni archivados.
# 2. Entran siempre las alternativas (alternativas.yaml) y las altas de abajo.
# 3. Entran los primeros de cada subtema (cupo_por_subtema), para que ningún tema se quede vacío.
# 4. Hasta llegar al objetivo, entran los candidatos con más estrellas, sean del subtema que sean.
# 5. Se apartan las listas, los cursos, lo abandonado, lo muy nuevo y lo excluido abajo.

version: 1

ajustes:
  # Proyectos que se buscan; fuera de mínimo y máximo, el robot falla.
  objetivo: 3000
  minimo: 2500
  maximo: 3500
  estrellas_minimas: 150
  # Con más meses sin cambios, un repo de las búsquedas está abandonado y no entra.
  meses_sin_actividad: 12
  # Los repos más nuevos son cosa del radar (Fase C): entran al catálogo si se consolidan.
  antiguedad_minima_dias: 90
  cupo_por_subtema: 35
  resultados_por_busqueda: 50

# Consultas extra para un subtema, con la sintaxis de búsqueda de GitHub.
# Ejemplo:  - subtema: edicion-de-fotos
#             consultas: ['"photo editor" in:name,description']
busquedas: []

# Proyectos que entran siempre, aunque no salgan en las búsquedas. Casi todos son referentes que en
# GitHub no tienen topics (o no los que llevan a su tema), así que las búsquedas no los encuentran.
