# Programas de pago o cerrados y sus alternativas open source.
#
# Cada programa genera /alternativas-a/{id} y /en/alternatives-to/{slug_en o id}.
# - nombre_en y slug_en: solo si cambian en inglés.
# - subtemas: dónde encaja el programa; se usan para los repos sin topics conocidos.
# - alternativas: repos de GitHub (propietario/repo). La semilla comprueba que existen, que no son
#   forks y que no están archivados. El orden no es un ranking: la web ordena por puntuación.
# - No se incluyen proyectos cuya copia en GitHub está parada aunque el proyecto siga vivo en otra
#   forja (Inkscape, digiKam), porque saldrían como abandonados.

