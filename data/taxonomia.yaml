# Taxonomía: áreas y subtemas del catálogo, en español e inglés.
#
# - id: identificador estable y dirección en español (/temas/{id}).
# - slug_en: dirección en inglés (/en/topics/{slug_en}).
# - publico: «usar» (listo para usar) o «programar» (para programadores). Es el valor por defecto
#   del subtema; cada proyecto puede tener el suyo.
# - topics: topics de GitHub que llevan a un repositorio a este subtema. Cada topic va en un solo
#   subtema. Se eligen con «pnpm --filter @aop/jobs run explorar -- <topic>»: se descartan los que
#   mezclan cosas distintas (por ejemplo, «matrix», que también son matrices matemáticas).
# - icono y tono: icono de Lucide y tono del color (0-360), como en la maqueta.
# - portada: aparece entre las tareas de la portada.

